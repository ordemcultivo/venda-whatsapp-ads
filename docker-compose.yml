version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: roberto-venda-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
    labels:
      # Traefik (se usar no Portainer)
      - "traefik.enable=true"
      - "traefik.http.routers.roberto-venda.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.roberto-venda.entrypoints=websecure"
      - "traefik.http.routers.roberto-venda.tls.certresolver=letsencrypt"
      - "traefik.http.services.roberto-venda.loadbalancer.server.port=3000"
    networks:
      - proxy

networks:
  proxy:
    external: true
